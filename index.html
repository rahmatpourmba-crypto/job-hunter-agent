                  <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                  <span>مشاهده در GitHub و دانلود رایگان</span>
                </a>
              </div>
            </div>
          )}

          {/* ================= FLOATING WHATSAPP WIDGET ================= */}
          <div className="fixed bottom-6 left-6 z-40 flex flex-col items-start gap-2">
            <a
              href={getWhatsAppLink("سلام جناب صادقی، از طریق سامانه تجارت و کاریابی پیام می‌دهم و مایل به استعلام و خرید اکانت VIP هستم.")}
              target="_blank"
              rel="noreferrer"
              className="group flex items-center gap-2.5 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white px-4 py-3 rounded-2xl shadow-2xl shadow-emerald-500/50 transition-all hover:scale-105 border border-emerald-400/40"
              title="ارتباط مستقیم در واتساپ"
            >
              <span className="relative flex h-3 w-3">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-200 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-3 w-3 bg-white"></span>
              </span>
              <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.24-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.78 2.71 4.3 3.8.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.17-.48-.29z"/>
              </svg>
              <div className="flex flex-col text-right">
                <span className="text-xs font-black leading-tight">سفارش و پشتیبانی در واتساپ</span>
                <span className="text-[10px] text-emerald-200">۰۹۱۴۱۶۸۸۲۱۷</span>
              </div>
            </a>
          </div>

          {/* ================= VIP & CARD-TO-CARD PAYMENT MODAL ================= */}
          {showVipModal && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 z-50 animate-fadeIn overflow-y-auto">
              <div className="glass-card max-w-lg w-full p-5 sm:p-7 rounded-3xl border border-amber-500/50 shadow-2xl relative my-auto">
                <button
                  onClick={() => setShowVipModal(false)}
                  className="absolute top-4 left-4 text-slate-400 hover:text-white text-lg p-2 transition-colors z-10"
                >
                  ✕
                </button>

                {/* Header */}
                <div className="text-center mb-5">
                  <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-400 flex items-center justify-center text-slate-950 font-black text-2xl mx-auto mb-2.5 shadow-xl shadow-amber-500/30">
                    👑
                  </div>
                  <h3 className="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400">
                    {t("vipModalTitle")}
                  </h3>
                  <p className="text-xs text-slate-300 mt-1.5 leading-relaxed">
                    {t("vipModalSubtitle")}
                  </p>
                </div>

                {/* Plan Selection Tabs */}
                <div className="grid grid-cols-2 gap-2 mb-4">
                  <button
                    type="button"
                    onClick={() => setSelectedPlan("30")}
                    className={`p-3 rounded-2xl border text-right transition-all flex flex-col justify-between ${
                      selectedPlan === "30"
                        ? "bg-amber-500/15 border-amber-500 ring-2 ring-amber-500/30"
                        : "bg-slate-900/60 border-slate-800 hover:border-slate-700"
                    }`}
                  >
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-white">{t("plan1MonthTitle")}</span>
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-mono font-bold">{t("plan1MonthTag")}</span>
                    </div>
                    <div className="mt-2 text-base font-extrabold text-amber-400">
                      {t("plan1MonthPrice")}
                    </div>
                  </button>

                  <button
                    type="button"
                    onClick={() => setSelectedPlan("365")}
                    className={`p-3 rounded-2xl border text-right transition-all flex flex-col justify-between relative overflow-hidden ${
                      selectedPlan === "365"
                        ? "bg-amber-500/15 border-amber-500 ring-2 ring-amber-500/30"
                        : "bg-slate-900/60 border-slate-800 hover:border-slate-700"
                    }`}
                  >
                    <div className="absolute -top-2 -left-8 bg-emerald-500 text-slate-950 text-[9px] font-black py-1 px-8 rotate-[-35deg]">
                      {t("plan1YearBadge")}
                    </div>
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-white">{t("plan1YearTitle")}</span>
                      <span className="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-mono font-bold">{t("plan1YearTag")}</span>
                    </div>
                    <div className="mt-2 text-base font-extrabold text-emerald-400">
                      {t("plan1YearPrice")}
                    </div>
                  </button>
                </div>

                {/* Smart Bank Card Display (Bank Keshavarzi - Abdulbaset Rahmatpour) */}
                <div className="bg-gradient-to-br from-amber-700 via-amber-800 to-yellow-950 p-4 rounded-2xl border border-amber-400/40 shadow-xl mb-4 relative overflow-hidden text-white">
                  <div className="flex justify-between items-center mb-3">
                    <span className="text-xs font-bold tracking-wider text-amber-200">{t("cardTitle")}</span>
                    <span className="text-xs font-mono bg-black/40 px-2 py-0.5 rounded text-amber-300">SHETAB</span>
                  </div>

                  <div className="text-center my-2 font-mono text-lg sm:text-xl font-black tracking-widest text-amber-100 select-all" dir="ltr">
                    {BANK_CARD_FORMATTED}
                  </div>

                  <div className="flex justify-between items-end mt-3 text-xs">
                    <div>
                      <span className="text-[10px] text-amber-300/80 block">{t("cardHolderLabel")}</span>
                      <span className="font-extrabold text-amber-100 text-sm">{BANK_OWNER}</span>
                    </div>
                    <button
                      type="button"
                      onClick={copyCardToClipboard}
                      className="bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 transition-all shadow-md shadow-black/30"
                    >
                      {cardCopied ? t("copyCardDone") : t("copyCardBtn")}
                    </button>
                  </div>
                </div>

                {/* Step 2: Payment Receipt Instructions & WhatsApp CTA */}
                <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 mb-4 space-y-3">
                  <div className="flex items-center justify-between text-xs text-slate-300">
                    <span className="font-bold">{t("payableAmount")}</span>
                    <span className="font-extrabold text-amber-400 text-sm">
                      {selectedPlan === "30" ? t("plan1MonthPrice") : t("plan1YearPrice")}
                    </span>
                  </div>

                  <div className="p-3 bg-amber-500/10 border border-amber-500/30 rounded-xl text-xs text-amber-200 leading-relaxed font-medium">
                    {t("receiptInstructions")}
                  </div>

                  <input
                    type="text"
                    value={trackingCode}
                    onChange={(e) => setTrackingCode(e.target.value)}
                    placeholder="شماره پیگیری واریز یا ۴ رقم آخر کارت شما"
                    className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                  />

                  <a
                    href={getWhatsAppLink(
                      `سلام جناب رحمت پور، مبلغ ${selectedPlan === "30" ? t("plan1MonthPrice") + " بابت اشتراک ۱ ماهه" : t("plan1YearPrice") + " بابت اشتراک ۱ ساله"} به شماره کارت ۶۰۳۷۷۰۱۶۱۶۹۳۹۵۵۶ واریز شد.${trackingCode ? " شماره پیگیری: " + trackingCode : ""} لطفاً کد اشتراک اختصاصی من را ارسال فرمایید.`
                    )}
                    target="_blank"
                    rel="noreferrer"
                    className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-green-600 hover:from-emerald-500 hover:to-green-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition-all text-xs text-center"
                  >
                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.196 8.196 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.03-1.24-.75-.67-1.26-1.5-1.41-1.75-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.43.13-.15.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.34-.76-1.84-.2-.49-.4-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.78 2.71 4.3 3.8.6.26 1.07.41 1.44.53.6.19 1.15.16 1.58.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.17-.48-.29z"/></svg>
                    <span>{t("sendReceiptBtn")}</span>
                  </a>
                </div>

                {/* Step 3: Enter Activation Code */}
                <div className="pt-3 border-t border-slate-800">
                  <label className="text-[11px] text-slate-300 block mb-1.5 font-bold">{t("enterCodeLabel")}</label>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={vipInputCode}
                      onChange={(e) => setVipInputCode(e.target.value)}
                      placeholder={t("codePlaceholder")}
                      className="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 font-mono text-center tracking-wider"
                    />
                    <button
                      onClick={handleVipCodeSubmit}
                      className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition-all shadow-md shadow-amber-500/20"
                    >
                      {t("submitCodeBtn")}
                    </button>
                  </div>
                  <p className="text-[10px] text-slate-500 mt-1.5 text-center">{t("codeNote")}</p>
                </div>

                {/* STRICTLY OWNER-ONLY Personalized Code Generator (Completely invisible to everyone else) */}
                {isOwner && (
                  <div className="mt-5 p-4 bg-slate-950/95 border-2 border-amber-500/70 rounded-2xl shadow-2xl">
                    <div className="flex items-center justify-between mb-2.5 pb-2 border-b border-slate-800">
                      <span className="font-extrabold text-amber-300 text-xs flex items-center gap-1.5">
                        <span>👑</span>
                        <span>پنل مدیریت و صدور کد اختصاصی مشتریان (مخصوص جناب رحمت‌پور)</span>
                      </span>
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 px-2.5 py-0.5 rounded-full font-bold">مدیر ارشد</span>
                    </div>

                    <label className="text-[11px] text-slate-400 block mb-1">نام یا شماره مشتری جهت صدور کد اختصاصی غیرتکراری:</label>
                    <input
                      type="text"
                      value={customerName}
                      onChange={(e) => setCustomerName(e.target.value)}
                      placeholder="مثال: علی رضایی، بازرگانی دبی، ۰۹۱۲..."
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 mb-3 focus:border-amber-500 focus:outline-none"
                    />

                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => generatePersonalizedCode("30")}
                        className="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow-md"
                      >
                        + صدور کد ۱ ماهه (۳۰ روز)
                      </button>
                      <button
                        type="button"
                        onClick={() => generatePersonalizedCode("365")}
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-3 rounded-xl text-xs transition-all shadow-md"
                      >
                        + صدور کد ۱ ساله (۳۶۵ روز)
                      </button>
                    </div>

                    {generatedCode && (
                      <div className="mt-3 p-3 bg-slate-900 rounded-xl border border-amber-500/50 text-center">
                        <div className="font-mono text-amber-300 font-extrabold text-sm tracking-wider select-all">
                          {generatedCode}
                        </div>
                        <div className="text-[11px] text-emerald-400 font-bold mt-1.5 flex items-center justify-center gap-1">
                          <span>✅</span>
                          <span>کد اختصاصی کپی شد! در واتساپ برای {customerName || 'مشتری'} ارسال کنید.</span>
                        </div>
                      </div>
                    )}
                  </div>
                )}

              </div>
            </div>
          )}

          {/* ================= TOAST NOTIFICATION ================= */}
          {toastMsg && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 text-sm font-bold animate-bounce">
              <Icons.Check />
              <span>{toastMsg}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
