                            <span>👑</span>
                            <span>پنل اختصاصی مدیریت کل سامانه (جناب رحمت پور)</span>
                          </div>

                          {/* Instant 1-Click Owner Lifetime Unlock */}
                          <button
                            type="button"
                            onClick={() => {
                              localStorage.setItem("b2b_is_owner", "true");
                              localStorage.setItem("b2b_vip_status", "true");
                              localStorage.setItem("b2b_vip_expiry", "9999999999999");
                              localStorage.setItem("b2b_vip_plan", "مدیر ارشد سامانه (Super Admin)");
                              localStorage.setItem("b2b_active_code", "OWNER-PERMANENT");
                              setIsOwner(true);
                              setIsVip(true);
                              setVipPlanName("مدیر ارشد سامانه");
                              setVipDaysLeft(9999);
                              showToast("👑 تبریک! دسترسی دائمی مدیر ارشد بدون نیاز به کد برای همیشه فعال شد.");
                              setShowVipModal(false);
                            }}
                            className="w-full bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/30 transition-all hover:scale-[1.02]"
                          >
                            <span>👑</span>
                            <span>فعال‌سازی دائمی حالت مدیر کل برای این مرورگر (بدون نیاز به بلیت)</span>
                          </button>

                          <div className="pt-2 border-t border-slate-800 text-[10px] text-slate-400 text-center">
                            صدور کدهای غیرتکراری برای مشتریان:
                          </div>

                          <div className="flex gap-2 justify-center">
                            <button
                              type="button"
                              onClick={() => generateUniqueCode("30")}
                              className="bg-amber-600/80 hover:bg-amber-500 text-white font-bold px-2.5 py-1.5 rounded-xl text-[11px] transition-all flex-1"
                            >
                              + صدور کد ۱ ماهه (VIP30)
                            </button>
                            <button
                              type="button"
                              onClick={() => generateUniqueCode("365")}
                              className="bg-emerald-600/80 hover:bg-emerald-500 text-white font-bold px-2.5 py-1.5 rounded-xl text-[11px] transition-all flex-1"
                            >
                              + صدور کد ۱ ساله (VIP365)
                            </button>
                          </div>

                          {generatedCode && (
                            <div className="p-2 bg-slate-900 rounded-xl border border-amber-500/40 font-mono text-amber-300 text-xs text-center select-all flex items-center justify-between">
                              <span>کد: <strong>{generatedCode}</strong></span>
                              <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded font-sans">کپی شد! به مشتری بفرستید</span>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}
          
          {/* ================= TOAST NOTIFICATION ================= */}
          {toastMsg && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gradient-to-r from-emerald-600 to-teal-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 z-50 text-sm font-bold animate-bounce">
              <Icons.Check />
              <span>{toastMsg}</span>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
