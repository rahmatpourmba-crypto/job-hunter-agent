name: Job Hunter Auto

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install --index-url https://pypi.org/simple -r requirements.txt

      - name: Hunt
        run: |
          python main.py search --profile hse --top 8
          python main.py search --profile web3 --top 8
          python main.py email --send

      - name: Commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json job_cache.json results
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update state/cache [skip ci]"
          git push
